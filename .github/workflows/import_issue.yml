name: Importador Automático de Issues

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'snake-duel-issues.csv'

permissions:
  contents: read
  issues: write

jobs:
  import-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Importar Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 << 'EOF'
          import csv
          import subprocess

          with open('snake-duel-issues.csv', newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)

              for row in reader:
                  title = row['Title']
                  body = row['Description']

                  print(f'Criando issue: {title}')

                  subprocess.run([
                      'gh',
                      'issue',
                      'create',
                      '--title', title,
                      '--body', body
                  ], check=True)

          EOF
