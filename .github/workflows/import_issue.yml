name: Importador Automático de Issues

on:
  workflow_dispatch: # Permite rodar manualmente clicando no botão "Run workflow"
  push:
    branches:
      - main # Monitora a branch principal
    paths:
      - 'snake-duel-issues.csv' # Dispara se o arquivo CSV for alterado

# Garante permissão de escrita para o token nativo criar as issues no repositório
permissions:
  contents: write
  issues: write

jobs:
  import-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Importar Issues do CSV
        uses: jasonm23/action-issue-importer@v1
        with:
          # Usando o token automático do GitHub Actions (sem segredos manuais)
          github-token: ${{ secrets.GITHUB_TOKEN }}
          csv-filepath: 'snake-duel-issues.csv'
          # Mapeia as colunas exatas do seu CSV para os campos das Issues
          column-mappings: 'title=Title,body=Status'
